<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialFlow — SMM Services</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--ink:#17191f;--muted:#747985;--line:#e7e9ee;--dark:#17191f;--accent:#635bff;--good:#16845b;--warn:#a56b08}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 15px;background:var(--dark);color:white;font-weight:650}button.secondary{background:#f0f1f4;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff0f0;color:#a32c2c;border:1px solid #f2d4d4}.wrap{max-width:1120px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand{font-size:21px;font-weight:850;letter-spacing:-.7px}.brand span{color:var(--accent)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{background:transparent;color:#535865}.nav button.active{background:#e9e8ff;color:#4038d8}.hero{background:#1c1e25;color:white;padding:34px;border-radius:18px;margin-bottom:24px}.hero h1{font-size:clamp(27px,5vw,42px);line-height:1.1;letter-spacing:-1.5px;margin:0 0 12px}.hero p{color:#c3c6cf;max-width:600px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}.card h3{margin:6px 0;font-size:17px}.muted{color:var(--muted)}.tag{font-size:12px;color:#4c46d7;background:#efeeff;padding:4px 8px;border-radius:20px;display:inline-block}.price{font-size:23px;font-weight:800;margin:12px 0}.section{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}.section h2{font-size:20px;margin:0}.hidden{display:none!important}.form{max-width:500px;margin:32px auto}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:13px;font-weight:700;color:#515662}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dfe2e8;border-radius:9px;background:#fff;color:#17191f}.field input:focus,.field select:focus{outline:2px solid #d9d7ff;border-color:#7770ff}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:750px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:#747985;background:#fafbfc;font-size:11px;text-transform:uppercase;letter-spacing:.5px}.status{display:inline-block;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:750;background:#f0f1f4}.status.completed,.status.success{background:#e4f6ed;color:#14734e}.status.pending,.status.awaiting_payment{background:#fff4dc;color:#91600a}.status.processing{background:#e9edff;color:#3548aa}.status.cancelled,.status.payment_failed{background:#ffe9e9;color:#a22}.notice{padding:12px 14px;border-radius:10px;background:#f0efff;color:#3932a5;margin:12px 0}.error{background:#fff0f0;color:#9d2727}.success{background:#e8f7ef;color:#176b49}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:12px}.link{max-width:230px;overflow-wrap:anywhere}.empty{padding:28px;text-align:center;color:var(--muted)}footer{padding:35px 0;text-align:center;color:#9095a0;font-size:12px}@media(max-width:650px){.wrap{padding:15px}.hero{padding:24px}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{padding:8px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand">Social<span>Flow</span></div><nav class="nav" id="nav"></nav></header>
<div id="app"></div><footer>SocialFlow · Orders are manually fulfilled after payment confirmation.</footer>
</div>
<script>
const $=s=>document.querySelector(s);let me=null,services=[],orders=[],current="home";
const money=n=>"₹"+Number(n||0).toFixed(2);
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function nav(){let items=me?[["home","Services"],["orders","My orders"],...(me.role==="admin"?[["admin","Admin panel"]]:[]),["account","Account"]]:[["home","Services"],["login","Log in"],["register","Create account"]];$("#nav").innerHTML=items.map(([k,v])=>`<button class="${current===k?"active":""}" onclick="go('${k}')">${v}</button>`).join("")}
async function init(){try{me=(await api("/api/me")).user;services=(await api("/api/services")).services;nav();render()}catch(e){$("#app").innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function go(p){current=p;nav();if(p==="orders"||p==="admin")orders=(await api("/api/orders")).orders;render()}
function render(){nav();if(current==="home")home();else if(current==="login"||current==="register")authPage();else if(current==="orders"||current==="admin")ordersPage();else if(current==="account")accountPage()}
function home(){$("#app").innerHTML=`<section class="hero"><h1>Grow your social presence.<br>Without the guesswork.</h1><p>Choose a service, add the exact post or profile link, and place your order. Every paid order is handled manually by our team.</p></section><div class="section"><h2>Available services</h2><span class="muted">${services.length} services</span></div><div class="grid">${services.map(s=>`<article class="card"><span class="tag">${esc(s.category)}</span><h3>${esc(s.name)}</h3><p class="muted">${esc(s.description)}</p><div class="price">${money(s.price_per_1000)} <small class="muted" style="font-size:12px;font-weight:500">/ 1,000</small></div><p class="muted">Min ${s.min_quantity.toLocaleString()} · Max ${s.max_quantity.toLocaleString()}</p><button onclick="buy(${s.id})" ${!me?"":""}>Order service</button></article>`).join("")||`<div class="empty">No services are available yet.</div>`}</div>`}
function authPage(){let reg=current==="register";$("#app").innerHTML=`<div class="card form"><h2>${reg?"Create your account":"Welcome back"}</h2><p class="muted">${reg?"Register to place and track orders.":"Log in to manage your orders."}</p><form onsubmit="submitAuth(event,${reg})">${reg?`<div class="field"><label>Your name</label><input name="name" required maxlength="80"></div>`:""}<div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Password</label><input type="password" name="password" required minlength="8"></div><button>${reg?"Create account":"Log in"}</button></form><p class="muted">${reg?'Already registered? <a href="#" onclick="go(\\'login\\')">Log in</a>':'New here? <a href="#" onclick="go(\\'register\\')">Create an account</a>'}</p><div id="authmsg"></div></div>`}
async function submitAuth(e,reg){e.preventDefault();let b=Object.fromEntries(new FormData(e.target));try{me=(await api(reg?"/api/register":"/api/login",{method:"POST",body:JSON.stringify(b)})).user;current="home";nav();home()}catch(x){$("#authmsg").innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}
function buy(id){if(!me){go("login");return}const s=services.find(x=>x.id===id);$("#app").innerHTML=`<div class="card form"><button class="secondary" onclick="go('home')">← Back to services</button><h2>${esc(s.name)}</h2><p class="muted">${esc(s.description)}</p><form onsubmit="placeOrder(event,${s.id})"><div class="field"><label>${esc(s.link_label)} · Required</label><input name="targetLink" type="url" placeholder="https://..." required></div><div class="field"><label>Quantity (${s.min_quantity}–${s.max_quantity})</label><input name="quantity" type="number" min="${s.min_quantity}" max="${s.max_quantity}" value="${s.min_quantity}" required oninput="calc(${s.id},this.value)"></div><div class="notice">Estimated total: <strong id="total">${money(s.min_quantity*s.price_per_1000/1000)}</strong></div><p class="muted" style="font-size:12px">Please ensure the target URL is correct and publicly accessible. Incorrect links may delay or prevent fulfilment.</p><button>Continue to payment</button></form><div id="buymsg"></div></div>`}
function calc(id,q){const s=services.find(x=>x.id===id);$("#total").textContent=money(Math.max(0,Number(q))*s.price_per_1000/1000)}
async function placeOrder(e,id){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{const d=await api("/api/orders",{method:"POST",body:JSON.stringify({serviceId:id,targetLink:b.targetLink,quantity:Number(b.quantity)})});$("#buymsg").innerHTML=`<div class="notice success"><b>Order #${d.orderId} created.</b><p>Complete payment using the link below. Then return and verify your payment.</p><p><a href="${esc(d.paymentLink)}" target="_blank" rel="noopener">Open payment link</a></p>${d.qrUrl?`<img src="${esc(d.qrUrl)}" width="190" alt="Payment QR">`:""}<button onclick="verify(${d.orderId})">I have paid · Verify payment</button></div>`}catch(x){$("#buymsg").innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}
async function verify(id){try{const d=await api(`/api/orders/${id}/verify`,{method:"POST"});alert(d.verified?"Payment verified! Your order is now in the admin queue.":d.message||"Payment not confirmed yet.");if(d.verified)go("orders")}catch(e){alert(e.message)}}
function ordersPage(){let admin=me.role==="admin";$("#app").innerHTML=`<div class="section"><h2>${admin?"All customer orders":"My orders"}</h2><button class="secondary" onclick="go('home')">Browse services</button></div><div class="tablewrap"><table><thead><tr><th>Order</th>${admin?"<th>Customer</th>":""}<th>Service / Target</th><th>Qty</th><th>Amount</th><th>Payment</th><th>Work status</th>${admin?"<th>Update</th>":""}</tr></thead><tbody>${orders.map(o=>`<tr><td>#${o.id}<br><small class="muted">${esc(o.created_at)}</small></td>${admin?`<td>${esc(o.customer_name)}<br>${esc(o.customer_email)}</td>`:""}<td><b>${esc(o.service_name)}</b><div class="link"><a href="${esc(o.target_link)}" target="_blank" rel="noopener">${esc(o.target_link)}</a></div></td><td>${o.quantity.toLocaleString()}</td><td>${money(o.amount)}</td><td><span class="status ${o.payment_status}">${esc(o.payment_status)}</span>${o.payment_utr?`<br><small>UTR ${esc(o.payment_utr)}</small>`:""}</td><td><span class="status ${o.status}">${esc(o.status)}</span></td>${admin?`<td><select onchange="setStatus(${o.id},this.value)">${["pending","processing","completed","partial","cancelled"].map(s=>`<option ${o.status===s?"selected":""} ${o.payment_status!=="success"?"disabled":""}>${s}</option>`).join("")}</select></td>`:""}</tr>`).join("")||`<tr><td colspan="8" class="empty">No orders yet.</td></tr>`}</tbody></table></div>${admin?`<div class="section"><h2>Manage services</h2></div><div class="card"><form class="grid" onsubmit="addService(event)"><div class="field"><label>Category</label><input name="category" required placeholder="Instagram"></div><div class="field"><label>Service name</label><input name="name" required placeholder="Instagram Story Views"></div><div class="field"><label>Target link label</label><input name="link_label" required placeholder="Instagram Story URL"></div><div class="field"><label>Price per 1,000 (₹)</label><input name="price_per_1000" type="number" step=".01" min=".01" required></div><div class="field"><label>Minimum quantity</label><input name="min_quantity" type="number" value="100"></div><div class="field"><label>Maximum quantity</label><input name="max_quantity" type="number" value="100000"></div><div class="field"><label>Description</label><input name="description"></div><div style="align-self:end"><button>Add service</button></div></form><div id="servicemsg"></div></div>`:""}`}
async function setStatus(id,status){try{await api(`/api/admin/orders/${id}`,{method:"PATCH",body:JSON.stringify({status})});orders=(await api("/api/orders")).orders;ordersPage()}catch(e){alert(e.message)}}
async function addService(e){e.preventDefault();try{await api("/api/admin/services",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});services=(await api("/api/services")).services;$("#servicemsg").innerHTML='<div class="notice success">Service added.</div>';e.target.reset()}catch(x){$("#servicemsg").innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}
function accountPage(){$("#app").innerHTML=`<div class="card form"><h2>Account</h2><p>${esc(me.name)}</p><p class="muted">${esc(me.email)} · ${esc(me.role)}</p><button onclick="logout()">Log out</button></div>`}
async function logout(){await api("/api/logout",{method:"POST"});me=null;current="home";nav();home()}
init();
</script></body></html>
